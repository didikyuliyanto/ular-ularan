<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Ular Klasik Modern</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
        }

        .arcade-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Glassmorphism & Visual Depth */
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        /* Canvas Border Glow */
        .canvas-container {
            position: relative;
            box-shadow: 0 0 25px rgba(34, 197, 94, 0.2);
            border-radius: 1rem;
            overflow: hidden;
        }

        /* Custom Touch Controls styling */
        .d-btn {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 4px 4px 10px #080d1a, -2px -2px 8px #1e293b;
            transition: all 0.1s ease;
        }

        .d-btn:active {
            box-shadow: inset 2px 2px 5px #080d1a, inset -2px -2px 5px #1e293b;
            transform: scale(0.95);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none overflow-x-hidden">

    <div class="w-full max-w-md mx-auto flex flex-col items-center gap-4">
        
        <!-- Header & Scores -->
        <div class="glass-card w-full p-4 rounded-2xl flex justify-between items-center border border-slate-700/50">
            <div>
                <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-500 flex items-center gap-2">
                    <i class="fa-solid font-bold fa-staff-snake text-green-400"></i> ULAR KLASIK
                </h1>
                <p class="text-xs text-slate-400">Gunakan panah / geser layar</p>
            </div>
            <div class="flex gap-4 text-right">
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Skor</span>
                    <span id="current-score" class="arcade-font text-lg text-green-400">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Tertinggi</span>
                    <span id="high-score" class="arcade-font text-lg text-yellow-400">0</span>
                </div>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="canvas-container bg-slate-900 border-2 border-slate-700/60 w-full aspect-square max-w-[400px] relative flex items-center justify-center">
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Overlay Screen (Start / Game Over / Pause) -->
            <div id="game-overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-10 transition-opacity duration-300">
                <div id="overlay-icon" class="text-5xl text-green-400 mb-3 animate-bounce">
                    <i class="fa-solid fa-play"></i>
                </div>
                <h2 id="overlay-title" class="text-2xl font-black mb-1 text-white">SIAP MAIN?</h2>
                <p id="overlay-desc" class="text-sm text-slate-400 mb-6">Pilih tingkat kesulitan dan tekan Mulai!</p>

                <!-- Difficulty Selector -->
                <div id="difficulty-selector" class="flex gap-2 mb-6 w-full max-w-xs">
                    <button data-speed="140" class="diff-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:border-green-500 transition">Mudah</button>
                    <button data-speed="90" class="diff-btn flex-1 py-2 text-xs font-bold rounded-lg border border-green-500 bg-green-500/20 text-green-400">Normal</button>
                    <button data-speed="50" class="diff-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:border-red-500 transition">Cepat</button>
                </div>

                <button id="start-btn" class="w-full max-w-xs py-3 px-6 bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-slate-950 font-black rounded-xl shadow-lg shadow-green-500/30 transition transform active:scale-95 uppercase tracking-wider text-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> Mulai Permainan
                </button>
            </div>
        </div>

        <!-- Controls / Actions -->
        <div class="w-full flex justify-between items-center gap-2">
            <button id="pause-btn" class="flex-1 py-2 px-4 glass-card rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800 flex items-center justify-center gap-2 border border-slate-700/50">
                <i class="fa-solid fa-pause"></i> <span>Jeda</span>
            </button>
            <button id="sound-btn" class="flex-1 py-2 px-4 glass-card rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800 flex items-center justify-center gap-2 border border-slate-700/50">
                <i class="fa-solid fa-volume-high"></i> <span>Suara: ON</span>
            </button>
        </div>

        <!-- Mobile Touch D-Pad -->
        <div class="sm:hidden w-full max-w-[260px] aspect-square grid grid-cols-3 grid-rows-3 gap-2 mt-2">
            <div></div>
            <button id="btn-up" class="d-btn rounded-2xl flex items-center justify-center text-slate-300 text-xl active:text-green-400">
                <i class="fa-solid fa-chevron-up"></i>
            </button>
            <div></div>
            <button id="btn-left" class="d-btn rounded-2xl flex items-center justify-center text-slate-300 text-xl active:text-green-400">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="flex items-center justify-center text-slate-600 text-xs font-bold">DPAD</div>
            <button id="btn-right" class="d-btn rounded-2xl flex items-center justify-center text-slate-300 text-xl active:text-green-400">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <div></div>
            <button id="btn-down" class="d-btn rounded-2xl flex items-center justify-center text-slate-300 text-xl active:text-green-400">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div></div>
        </div>

    </div>

    <script>
        // Game Configuration & Variables
        const GRID_SIZE = 20; // 20x20 Grid
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let tileSize = 0;
        let snake = [];
        let food = { x: 0, y: 0, type: 'normal' };
        let dx = 1; // Initial direction (Right)
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        let gameSpeed = 90; // Default speed in ms
        let gameInterval = null;
        let isPaused = false;
        let isGameOver = false;
        let isGameStarted = false;
        let soundEnabled = true;

        // Sound Effects Setup via Tone.js
        let eatSynth, gameOverSynth, bonusSynth;

        function initAudio() {
            try {
                eatSynth = new Tone.Synth({
                    oscillator: { type: 'triangle' },
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 }
                }).toDestination();

                bonusSynth = new Tone.Synth({
                    oscillator: { type: 'sine' },
                    envelope: { attack: 0.01, decay: 0.2, sustain: 0.1, release: 0.2 }
                }).toDestination();

                gameOverSynth = new Tone.MembraneSynth().toDestination();
            } catch (e) {
                console.log("Audio Init failed", e);
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (Tone.context.state !== 'running') {
                    Tone.start();
                }
                if (type === 'eat' && eatSynth) {
                    eatSynth.triggerAttackRelease("C5", "8n");
                } else if (type === 'bonus' && bonusSynth) {
                    bonusSynth.triggerAttackRelease("G5", "8n");
                } else if (type === 'die' && gameOverSynth) {
                    gameOverSynth.triggerAttackRelease("C2", "4n");
                }
            } catch (e) {
                // Ignore audio context errors on un-interacted browsers
            }
        }

        // Setup Responsive Canvas Resolution
        function resizeCanvas() {
            const container = canvas.parentElement;
            const size = container.clientWidth;
            canvas.width = size;
            canvas.height = size;
            tileSize = size / GRID_SIZE;
            if (isGameStarted) draw();
        }

        window.addEventListener('resize', resizeCanvas);
        document.getElementById('high-score').textContent = highScore;

        // Initialize Game State
        function resetGame() {
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            document.getElementById('current-score').textContent = score;
            spawnFood();
            isGameOver = false;
            isPaused = false;
        }

        // Spawn Food in Random Empty Cell
        function spawnFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
            }
            // 20% chance for bonus food
            food.type = Math.random() < 0.2 ? 'bonus' : 'normal';
        }

        function gameLoop() {
            if (isPaused || isGameOver) return;

            // Apply buffered directional changes
            dx = nextDx;
            dy = nextDy;

            // Calculate new head position
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check Wall Collisions
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                handleGameOver();
                return;
            }

            // Check Self Collision
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                handleGameOver();
                return;
            }

            // Add new Head
            snake.unshift(head);

            // Check Food Collision
            if (head.x === food.x && head.y === food.y) {
                const points = food.type === 'bonus' ? 30 : 10;
                score += points;
                document.getElementById('current-score').textContent = score;

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snake_high_score', highScore);
                    document.getElementById('high-score').textContent = highScore;
                }

                playSound(food.type === 'bonus' ? 'bonus' : 'eat');
                spawnFood();
            } else {
                // Remove Tail if no food eaten
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Subtle Grid Lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // Draw Food
            const foodX = food.x * tileSize;
            const foodY = food.y * tileSize;
            ctx.save();
            if (food.type === 'bonus') {
                // Golden Bonus Food
                ctx.fillStyle = '#f59e0b';
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(foodX + tileSize / 2, foodY + tileSize / 2, tileSize / 2 - 2, 0, Math.PI * 2);
                ctx.fill();
            } else {
                // Red Normal Food
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.roundRect(foodX + 2, foodY + 2, tileSize - 4, tileSize - 4, 6);
                ctx.fill();
            }
            ctx.restore();

            // Draw Snake
            snake.forEach((segment, index) => {
                const segX = segment.x * tileSize;
                const segY = segment.y * tileSize;

                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#22c55e';
                    ctx.shadowColor = '#22c55e';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.roundRect(segX + 1, segY + 1, tileSize - 2, tileSize - 2, 6);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#0f172a';
                    const eyeSize = tileSize / 5;
                    let eyeX1, eyeY1, eyeX2, eyeY2;

                    if (dx === 1) { // Moving Right
                        eyeX1 = segX + tileSize * 0.7; eyeY1 = segY + tileSize * 0.25;
                        eyeX2 = segX + tileSize * 0.7; eyeY2 = segY + tileSize * 0.75;
                    } else if (dx === -1) { // Left
                        eyeX1 = segX + tileSize * 0.3; eyeY1 = segY + tileSize * 0.25;
                        eyeX2 = segX + tileSize * 0.3; eyeY2 = segY + tileSize * 0.75;
                    } else if (dy === -1) { // Up
                        eyeX1 = segX + tileSize * 0.25; eyeY1 = segY + tileSize * 0.3;
                        eyeX2 = segX + tileSize * 0.75; eyeY2 = segY + tileSize * 0.3;
                    } else { // Down
                        eyeX1 = segX + tileSize * 0.25; eyeY1 = segY + tileSize * 0.7;
                        eyeX2 = segX + tileSize * 0.75; eyeY2 = segY + tileSize * 0.7;
                    }

                    ctx.beginPath();
                    ctx.arc(eyeX1, eyeY1, eyeSize / 2, 0, Math.PI * 2);
                    ctx.arc(eyeX2, eyeY2, eyeSize / 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Body Gradient effect
                    const alpha = 1 - (index / snake.length) * 0.6;
                    ctx.fillStyle = `rgba(34, 197, 94, ${alpha})`;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.roundRect(segX + 1.5, segY + 1.5, tileSize - 3, tileSize - 3, 4);
                    ctx.fill();
                }
            });
        }

        // Game State Control Functions
        function startGame() {
            initAudio();
            resetGame();
            isGameStarted = true;
            hideOverlay();
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
            resizeCanvas();
        }

        function handleGameOver() {
            isGameOver = true;
            clearInterval(gameInterval);
            playSound('die');

            showOverlay(
                '<i class="fa-solid fa-skull-crossbones"></i>',
                'GAME OVER',
                `Skor Akhir: <span class="text-green-400 font-bold arcade-font">${score}</span>`,
                'MAIN LAGI'
            );
        }

        function togglePause() {
            if (!isGameStarted || isGameOver) return;
            isPaused = !isPaused;
            const pauseBtnText = document.querySelector('#pause-btn span');
            const pauseBtnIcon = document.querySelector('#pause-btn i');

            if (isPaused) {
                pauseBtnText.textContent = "Lanjut";
                pauseBtnIcon.className = "fa-solid fa-play";
                showOverlay(
                    '<i class="fa-solid fa-pause"></i>',
                    'DIJEDA',
                    'Tekan Lanjut untuk meneruskan permainan',
                    'LANJUTKAN'
                );
            } else {
                pauseBtnText.textContent = "Jeda";
                pauseBtnIcon.className = "fa-solid fa-pause";
                hideOverlay();
            }
        }

        // Overlay UI Controller
        function showOverlay(iconHtml, title, descHtml, btnText) {
            const overlay = document.getElementById('game-overlay');
            document.getElementById('overlay-icon').innerHTML = iconHtml;
            document.getElementById('overlay-title').textContent = title;
            document.getElementById('overlay-desc').innerHTML = descHtml;
            document.getElementById('start-btn').innerHTML = `<i class="fa-solid fa-play"></i> ${btnText}`;
            
            // Toggle difficulty selector visibility depending on context
            const diffSelector = document.getElementById('difficulty-selector');
            if (isPaused) {
                diffSelector.classList.add('hidden');
            } else {
                diffSelector.classList.remove('hidden');
            }

            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        function hideOverlay() {
            const overlay = document.getElementById('game-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function changeDirection(dir) {
            if (isPaused || !isGameStarted) return;
            if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -1; }
            if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = 1; }
            if (dir === 'LEFT' && dx === 0) { nextDx = -1; nextDy = 0; }
            if (dir === 'RIGHT' && dx === 0) { nextDx = 1; nextDy = 0; }
        }

        // Keyboard Inputs
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault(); // Prevent page scrolling
            }
            switch (e.key) {
                case 'ArrowUp': case 'w': case 'W': changeDirection('UP'); break;
                case 'ArrowDown': case 's': case 'S': changeDirection('DOWN'); break;
                case 'ArrowLeft': case 'a': case 'A': changeDirection('LEFT'); break;
                case 'ArrowRight': case 'd': case 'D': changeDirection('RIGHT'); break;
                case ' ': togglePause(); break;
            }
        });

        // Touch Control Buttons
        document.getElementById('btn-up').addEventListener('click', () => changeDirection('UP'));
        document.getElementById('btn-down').addEventListener('click', () => changeDirection('DOWN'));
        document.getElementById('btn-left').addEventListener('click', () => changeDirection('LEFT'));
        document.getElementById('btn-right').addEventListener('click', () => changeDirection('RIGHT'));

        // Swipe Controls on Canvas
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (!isGameStarted || isPaused) return;
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            const threshold = 30; // Min swipe distance

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    changeDirection(diffX > 0 ? 'RIGHT' : 'LEFT');
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    changeDirection(diffY > 0 ? 'DOWN' : 'UP');
                }
            }
        }, { passive: true });

        // Difficulty Selection
        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => {
                    b.className = "diff-btn flex-1 py-2 text-xs font-bold rounded-lg border border-slate-700 bg-slate-800 text-slate-300 hover:border-green-500 transition";
                });
                e.target.className = "diff-btn flex-1 py-2 text-xs font-bold rounded-lg border border-green-500 bg-green-500/20 text-green-400";
                gameSpeed = parseInt(e.target.dataset.speed);
            });
        });

        // Main Action Buttons
        document.getElementById('start-btn').addEventListener('click', () => {
            if (isPaused) {
                togglePause();
            } else {
                startGame();
            }
        });

        document.getElementById('pause-btn').addEventListener('click', togglePause);

        document.getElementById('sound-btn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const soundBtnText = document.querySelector('#sound-btn span');
            const soundBtnIcon = document.querySelector('#sound-btn i');
            
            if (soundEnabled) {
                soundBtnText.textContent = "Suara: ON";
                soundBtnIcon.className = "fa-solid fa-volume-high";
            } else {
                soundBtnText.textContent = "Suara: OFF";
                soundBtnIcon.className = "fa-solid fa-volume-xmark";
            }
        });

        // Initialize display on load
        window.onload = () => {
            resizeCanvas();
            draw();
        };
    </script>
</body>
</html>
